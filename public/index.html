<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>200 OK</title>

    <!-- Lottie Web Component -->
    <script
      src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.8.11/dist/dotlottie-wc.js"
      type="module"
    ></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
      }

      body {
        height: 100vh;
        width: 100vw;
        background: url("https://images-wixmp-ed30a86b8c4ca887773594c2.wixmp.com/i/d96bb958-4e6c-4ce0-9447-fbe226fbbecf/dk6jetj-f2fde394-efd7-441d-abba-ae41f6210955.jpg/v1/fill/w_1192,h_670,q_70,strp/demon_slayer_infinity_castle_animated_wallpaper_by_favorisxp_dk6jetj-pre.jpg")
          no-repeat center center / cover;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .overlay {
        position: absolute;
        inset: 0;
      }

      .card {
        position: relative;
        z-index: 2;
        text-align: center;
        padding: 40px 60px;
        border-radius: 20px;
        background: rgba(0, 0, 0, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        color: white;
      }

      h1 {
        font-size: 48px;
        margin-bottom: 10px;
        letter-spacing: 2px;
      }

      p {
        font-size: 18px;
        opacity: 0.85;
        margin-bottom: 20px;
      }

      dotlottie-wc {
        margin: 0 auto 20px;
      }

      .badge {
        margin-top: 10px;
        display: inline-block;
        padding: 6px 14px;
        border-radius: 999px;
        background: #22c55e;
        font-weight: 600;
        font-size: 14px;
        color: black;
      }
    </style>
  </head>

  <body>
    <div class="overlay"></div>

    <div class="card">
      <dotlottie-wc
        src="https://lottie.host/c5d900c7-3e08-4520-a00f-bd9c941097e5/jEn6Hb9nOt.lottie"
        style="width: 220px; height: 220px"
        autoplay
        loop
      ></dotlottie-wc>

      <h1>200 OK</h1>
      <p>Your request has been successfully processed.</p>
      <div class="badge">SUCCESS</div>
    </div>
  </body>
</html>
